name: Build HondaDeck APK

# Gera o APK de debug do HondaDeck em qualquer branch que mexa em HondaDeck/,
# para baixar direto do GitHub (aba Actions > execução > Artifacts) e instalar no tablet.
on:
  push:
    paths:
      - 'HondaDeck/**'
      - '.github/workflows/build-hondadeck.yml'
  workflow_dispatch:

permissions:
  contents: write # publicar o APK na release fixa "hondadeck-latest"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HondaDeck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # O android-actions/setup-android@v3 está falhando desde 23/11 (o build-apk.yml
      # do repositório também). O runner ubuntu já traz o Android SDK; aqui só se
      # instalam os pacotes que faltam com o sdkmanager dele.
      - name: Android SDK, NDK e CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;28.2.13676358" | tail -n 5

      # SEM chaves embutidas: o repositório é público e o APK vai para uma release
      # pública (link do QR code). Qualquer pessoa poderia extrair uma chave do APK.
      # A chave do Gemini é digitada uma vez em Configurações > Agente e fica salva
      # só no tablet. Builds locais continuam lendo HondaDeck/local.properties.
      - name: local.properties vazio
        run: ': > local.properties'

      # Gera as duas versões (veja HondaDeck/INSTALACAO.md):
      #  completo = USB/ADB, com o serviço de notificações (WhatsApp e mídia)
      #  qr       = QR code/navegador, sem ele (senão o Android bloqueia a instalação)
      - name: Testes da lógica e APKs de debug (completo + qr)
        run: |
          chmod +x gradlew
          ./gradlew :core-protocol:test :app:assembleCompletoDebug :app:assembleQrDebug --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/completo/debug/*.apk dist/HondaDeck-completo.apk
          cp app/build/outputs/apk/qr/debug/*.apk dist/HondaDeck.apk

      # Trava de segurança: o APK do QR nunca pode levar o NotificationListenerService.
      - name: Conferir manifestos dos APKs
        run: |
          AA="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          if "$AA" manifest print dist/HondaDeck.apk | grep -q NotificationListenerService; then
            echo "::error::HondaDeck.apk (QR) contém o NotificationListenerService"; exit 1
          fi
          if ! "$AA" manifest print dist/HondaDeck-completo.apk | grep -q NotificationListenerService; then
            echo "::error::HondaDeck-completo.apk não contém o NotificationListenerService"; exit 1
          fi
          echo "Manifestos OK: QR sem listener, completo com listener."

      - name: Publicar APKs
        uses: actions/upload-artifact@v4
        with:
          name: HondaDeck-debug-${{ github.ref_name }}
          path: HondaDeck/dist/*.apk
          retention-days: 30

      # Links fixos (sempre a versão mais nova):
      #  QR code:  https://github.com/gabrieljoffre/AutoDeck/releases/download/hondadeck-latest/HondaDeck.apk
      #  USB/ADB:  https://github.com/gabrieljoffre/AutoDeck/releases/download/hondadeck-latest/HondaDeck-completo.apk
      - name: Publicar na release hondadeck-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hondadeck-latest
          name: HondaDeck (última versão)
          body: |
            APKs de debug do HondaDeck, gerados automaticamente.
            Branch: ${{ github.ref_name }} · commit ${{ github.sha }}

            - HondaDeck-completo.apk: instalar pelo USB (ADB), em casa. Tem WhatsApp e capa/título de qualquer app de música.
            - HondaDeck.apk: instalar pelo QR code/navegador. Sem WhatsApp.

            Instruções: HondaDeck/INSTALACAO.md
          prerelease: true
          make_latest: false
          files: |
            HondaDeck/dist/HondaDeck.apk
            HondaDeck/dist/HondaDeck-completo.apk

      # Os testes do app rodam depois do APK publicado: uma falha aqui aparece
      # em vermelho, mas não impede baixar o APK para testar no carro.
      - name: Testes do app
        id: apptests
        continue-on-error: true
        run: ./gradlew :app:testCompletoDebugUnitTest --stacktrace

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HondaDeck-test-reports-${{ github.ref_name }}
          path: |
            HondaDeck/core-protocol/build/reports/tests
            HondaDeck/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
