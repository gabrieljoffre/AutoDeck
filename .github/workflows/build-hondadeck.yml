name: Build HondaDeck APK

# Gera o APK de debug do HondaDeck em qualquer branch que mexa em HondaDeck/,
# para baixar direto do GitHub (aba Actions > execução > Artifacts) e instalar no tablet.
on:
  push:
    paths:
      - 'HondaDeck/**'
      - '.github/workflows/build-hondadeck.yml'
  workflow_dispatch:

permissions:
  contents: write # publicar o APK na release fixa "hondadeck-latest"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HondaDeck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # O android-actions/setup-android@v3 está falhando desde 23/11 (o build-apk.yml
      # do repositório também). O runner ubuntu já traz o Android SDK; aqui só se
      # instalam os pacotes que faltam com o sdkmanager dele.
      - name: Android SDK, NDK e CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;28.2.13676358" | tail -n 5

      # SEM chaves embutidas: o repositório é público e o APK vai para uma release
      # pública (link do QR code). Qualquer pessoa poderia extrair uma chave do APK.
      # A chave do Gemini é digitada uma vez em Configurações > Agente e fica salva
      # só no tablet. Builds locais continuam lendo HondaDeck/local.properties.
      - name: local.properties vazio
        run: ': > local.properties'

      - name: Testes da lógica e APK de debug
        run: |
          chmod +x gradlew
          ./gradlew :core-protocol:test :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: HondaDeck-debug-${{ github.ref_name }}
          path: HondaDeck/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Link fixo para o QR code de instalação (sempre a versão mais nova):
      # https://github.com/gabrieljoffre/AutoDeck/releases/download/hondadeck-latest/HondaDeck.apk
      - name: Preparar APK para a release
        run: cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/HondaDeck.apk

      - name: Publicar na release hondadeck-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hondadeck-latest
          name: HondaDeck (última versão)
          body: |
            APK de debug do HondaDeck, gerado automaticamente.
            Branch: ${{ github.ref_name }} · commit ${{ github.sha }}
            Instalar: baixar HondaDeck.apk no tablet (ou ler o QR code).
          prerelease: true
          make_latest: false
          files: HondaDeck/app/build/outputs/apk/debug/HondaDeck.apk

      # Os testes do app rodam depois do APK publicado: uma falha aqui aparece
      # em vermelho, mas não impede baixar o APK para testar no carro.
      - name: Testes do app
        id: apptests
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HondaDeck-test-reports-${{ github.ref_name }}
          path: |
            HondaDeck/core-protocol/build/reports/tests
            HondaDeck/app/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
