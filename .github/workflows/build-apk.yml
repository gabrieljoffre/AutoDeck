name: Build AutoDeck & Release APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # android-actions/setup-android@v3 passou a falhar em 23/11. O runner ubuntu já
      # traz o Android SDK; aqui só se instalam os pacotes que faltam com o sdkmanager
      # dele (mesma correção do build-hondadeck.yml).
      - name: Install Android NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "cmake;3.22.1" "ndk;28.2.13676358" | tail -n 5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run core-protocol unit tests and assemble Debug APKs
        run: ./gradlew :core-protocol:test :app:assembleDebug :companion-app:assembleDebug --stacktrace

      - name: Prepare release APK names
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/AutoDeck-debug.apk
          cp companion-app/build/outputs/apk/debug/companion-app-debug.apk release-apks/AutoDeck-Link-debug.apk

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: AutoDeck-apks
          path: release-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apks/AutoDeck-debug.apk
            release-apks/AutoDeck-Link-debug.apk
