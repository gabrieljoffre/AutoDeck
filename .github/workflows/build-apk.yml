name: Build AutoDeck Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;28.2.13676358

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run core-protocol unit tests and assemble Debug APK
        run: ./gradlew :core-protocol:test :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoDeck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
